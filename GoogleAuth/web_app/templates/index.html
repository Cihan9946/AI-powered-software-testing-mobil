<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Güvenlik Analizi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div id="auth-container">
            <div id="login-form" class="text-center">
                <h2>Giriş Yap</h2>
                <button id="google-signin" class="btn btn-primary">
                    <img src="/static/images/google_logo.png" alt="Google" class="google-logo">
                    Google ile Giriş Yap
                </button>
            </div>
        </div>

        <div id="app-container" style="display: none;">
            <div class="row">
                <div class="col-md-12">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h1>Güvenlik Analizi</h1>
                        <button id="logout-btn" class="btn btn-outline-danger">Çıkış Yap</button>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-12">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Dosya Yükle</h5>
                            <form id="upload-form">
                                <div class="mb-3">
                                    <input type="file" class="form-control" id="file-input" accept=".zip">
                                </div>
                                <button type="submit" class="btn btn-primary">Yükle ve Analiz Et</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row mt-4">
                <div class="col-md-12">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Yüklenen Dosyalar</h5>
                            <div id="filesList"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="message-container"></div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>

    <!-- Firebase Config -->
    <script src="/static/js/firebase-config.js"></script>
    
    <!-- Main JS -->
    <script src="/static/js/main.js"></script>
</body>
</html>
